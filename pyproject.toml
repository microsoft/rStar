[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rstar2_agent"
version = "0.1.0"
description = "rstar2-agent core training recipe"
dependencies = [
    "weave",
    "sympy",
    "scipy",
    "math-verify"
]

[tool.setuptools]
packages = ["rstar2_agent", "fused_compute_score"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402", "E731", "E722", "E741", "E721", "E701", "F841", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.uv]
# Install with: uv sync
